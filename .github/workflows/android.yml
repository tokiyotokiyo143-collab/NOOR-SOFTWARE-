name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last working index.html
        run: |
          mkdir -p app/src/main/assets
          git show 8f673aa:app/src/main/assets/index.html > app/src/main/assets/index.html
          ls -l app/src/main/assets/index.html

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Create debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK contains real page
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep index.html

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoorSoftware-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
