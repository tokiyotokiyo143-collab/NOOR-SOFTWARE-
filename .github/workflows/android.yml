name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Use staged index.html
        run: |
          cd app/src/main/assets
          f=$(ls -1 [0-9]*-index.html 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$f" ]; then cp -f "$f" index.html; rm -f [0-9]*-index.html; fi
          ls -l index.html

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoorSoftware-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
